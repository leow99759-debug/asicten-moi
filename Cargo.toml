[workspace]
members = ["crates/core", "crates/win", "crates/ai", "crates/remote", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "LicenseRef-Private"
publish = false

[workspace.dependencies]
jarvis-core = { path = "crates/core" }
jarvis-win = { path = "crates/win" }
jarvis-ai = { path = "crates/ai" }
jarvis-remote = { path = "crates/remote" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
tempfile = "3"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
