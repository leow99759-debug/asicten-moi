name: CI

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache offline assets
        uses: actions/cache@v4
        with:
          path: assets/.download
          key: assets-${{ hashFiles('tools/assets.sha256') }}

      - name: Fetch offline assets (Release assets-v1)
        shell: pwsh
        run: ./tools/fetch-assets.ps1
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (ci, check, build, test)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
          npx vitest run

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # sherpa-onnx-sys extracts its prebuilt libs into target/, which rust-cache prunes
      # (the build-script result survives, so linking fails). Give it a fixed folder instead.
      - name: Cache sherpa-onnx libs
        uses: actions/cache@v4
        with:
          path: .sherpa
          key: sherpa-onnx-${{ hashFiles('Cargo.lock') }}

      - name: sherpa-onnx prebuilt libs
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $v = ((Select-String -Path Cargo.lock -Pattern '^name = "sherpa-onnx-sys"$' -Context 0,1).Context.PostContext[0] -replace '.*"(.+)"', '$1')
          $name = "sherpa-onnx-v$v-win-x64-static-MT-Release-lib"
          if (-not (Test-Path ".sherpa/$name/lib/sherpa-onnx-c-api.lib")) {
            New-Item -ItemType Directory -Force .sherpa | Out-Null
            Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/$name.tar.bz2" -OutFile .sherpa/libs.tar.bz2
            tar -xjf .sherpa/libs.tar.bz2 -C .sherpa
            Remove-Item .sherpa/libs.tar.bz2
          }
          if (-not (Test-Path ".sherpa/$name/lib/sherpa-onnx-c-api.lib")) { throw "sherpa-onnx libs missing" }
          "SHERPA_ONNX_LIB_DIR=$PWD\.sherpa\$name\lib" >> $env:GITHUB_ENV

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: TS bindings up to date
        run: git diff --exit-code -- frontend/src/lib/bindings
