name: CI

on:
  push:
    branches: [main]
    tags: ["m*", "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache offline assets
        uses: actions/cache@v4
        with:
          path: assets/.download
          key: assets-${{ hashFiles('tools/assets.sha256') }}

      - name: Fetch offline assets (Release assets-v1)
        shell: pwsh
        run: ./tools/fetch-assets.ps1
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend (ci, check, build, test)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
          npx vitest run

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # rust-cache empties target/sherpa-onnx-prebuilt (keeps the dir) but keeps the
      # build-script result, so linking fails. If the .lib is gone, rerun the build script.
      - name: sherpa-onnx prebuilt libs
        shell: pwsh
        run: |
          $lib = Get-ChildItem target/sherpa-onnx-prebuilt -Recurse -Filter sherpa-onnx-c-api.lib -ErrorAction SilentlyContinue
          if (-not $lib) { cargo clean -p sherpa-onnx-sys }

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: TS bindings up to date
        run: git diff --exit-code -- frontend/src/lib/bindings
